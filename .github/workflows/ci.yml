name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Checar tipos
        run: npm run typecheck

      - name: Rodar testes
        run: npm test

      # Roda sem nenhum segredo de propósito: se o build depender de uma
      # variável de ambiente, é aqui que a gente descobre — não em produção.
      - name: Build
        run: npm run build
